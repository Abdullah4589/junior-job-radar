name: Pages

# Static export of web/ for GitHub Pages. The dashboard reads the committed
# catalog at build time. This workflow does not call the job boards and does
# not use a secret.
#
# GitHub publishes the artifact only after Settings → Pages → Build and
# deployment → Source is "GitHub Actions". This file does not change that
# setting.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static dashboard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: Build the static export
        working-directory: web
        run: npm run build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pages: write publishes the uploaded artifact.
    # id-token: write is the OIDC token deploy-pages exchanges for that publish.
    # Job permissions replace the workflow permissions, so this job has no
    # contents scope. The build job only inherits contents: read. Uploading
    # the artifact uses the Actions runtime token, not a pages scope.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
